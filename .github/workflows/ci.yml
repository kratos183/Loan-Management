# ─────────────────────────────────────────────────────────────────────────────
# CI — runs on every push and pull request
#
# Each gate is its own job so it appears as a separate status check and can be
# required individually in the branch ruleset. A single job with four steps
# would register as one check, and you could not require just the maths tests.
#
#   typecheck  — TypeScript
#   test       — EMI / amortisation / underwriting maths
#   db:check   — SQL parses with libpg_query + structural checks
#   build      — full production build
#
# Checks that need a database (db:migrate, db:verify, db:embeds, smoke) are
# deliberately NOT here — see ci-live.yml. They need the service_role key,
# which must never be exposed to fork pull requests.
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  db-check:
    name: db:check
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Needs no database and no secrets, so every PR gets it — including
      # forks. Catches unbalanced dollar quoting, truncation, unescaped
      # apostrophes, INSERT arity mismatches and real parse errors.
      - run: npm run db:check

      # Guard the mistake that cost the most time: passing a component or
      # function across the Server → Client boundary. next build cannot catch
      # it because session-scoped pages are never prerendered.
      - name: Check for Server → Client boundary leaks
        run: |
          if grep -rn --include='*.tsx' --include='*.ts' \
               -E '(sections|navItems|navConfig)=\{' app lib 2>/dev/null; then
            echo "::error file=lib/navigation.ts::Nav config holds icon components. Pass the portal name and import the config inside the client component instead."
            exit 1
          fi
          echo "No component references passed across the boundary."

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Placeholder values: the build must not depend on a live project, so
      # forks and contributor PRs can run it.
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
        run: npm run build

      - name: Upload build output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .next/
          retention-days: 5
          include-hidden-files: true